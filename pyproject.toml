[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyprof"
version = "0.0.3"
authors = [
  { name="Yotam Raz", email="yotamraz2007@gmail.com" },
]
description = "A simple python profiler"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "pandas>=1.5.3",
  "plotly>=5.15.0",
  "psutil>=5.9.5",
]

[project.optional-dependencies]
nvidia = [
  "nvidia-ml-py3>=7.352.0",
]

[project.urls]
"Homepage" = "https://github.com/yotamraz/pyprof"

